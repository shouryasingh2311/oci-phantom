name: OCI Instance Sniper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  try-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: Skip if instance already exists
        id: check
        run: |
          COUNT=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --display-name "Phantom-Restored" \
            --query "length(data[?\"lifecycle-state\" != 'TERMINATED'])" \
            --raw-output 2>/dev/null || echo "0")
          if [ -z "$COUNT" ]; then COUNT=0; fi
          echo "Instance count: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt launch
        if: steps.check.outputs.found == 'false'
        id: launch
        continue-on-error: true
        run: |
          oci compute instance launch \
            --availability-domain "aKnM:AP-MUMBAI-1-AD-1" \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
            --source-boot-volume-id "${{ secrets.OCI_BOOT_VOLUME_ID }}" \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --assign-public-ip true \
            --display-name "Phantom-Restored" \
            --metadata "{\"ssh_authorized_keys\": \"${{ secrets.OCI_SSH_KEY }}\"}" \
            2>&1 | tee launch_output.txt
          grep -q '"lifecycle-state": "PROVISIONING"' launch_output.txt

      - name: Notify success on Telegram
        if: steps.launch.outcome == 'success'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🎉 Phantom-Restored instance was just created! Check the OCI console for its IP."
